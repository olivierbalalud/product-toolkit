# Checks every link in the docs: on PRs that change Markdown, monthly, and by hand [R11-Q9].
name: Link check

on:
  pull_request:
    paths: ["**/*.md"]
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --include-fragments
            --max-concurrency 4
            --accept 200,206,429
            'README.md' 'CLAUDE.md' 'docs/**/*.md'
          fail: true
